  <text x="66" y="69" fill="#F27650" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2">A LITTLE ABOUT MY WORK</text>
  <text x="64" y="119" fill="#262A24" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">Thoughtful mobile apps,</text>
  <text x="64" y="158" fill="#262A24" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">built from idea to release.</text>
  <text x="66" y="198" fill="#747A70" font-family="Arial,Helvetica,sans-serif" font-size="15">I’m Shyam, a Flutter developer focused on clear interfaces,</text>
  <text x="66" y="222" fill="#747A70" font-family="Arial,Helvetica,sans-serif" font-size="15">useful details, and dependable app experiences.</text>

  <circle cx="75" cy="271" r="13" fill="#E7E4FB"/><path d="M70 271L74 275L81 267" stroke="#695BB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="99" y="275" fill="#555B51" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">Flutter &amp; Dart</text>
  <circle cx="242" cy="271" r="13" fill="#FFF0E8"/><path d="M237 271L241 275L248 267" stroke="#D96F4D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="266" y="275" fill="#555B51" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">Firebase</text>
  <circle cx="372" cy="271" r="13" fill="#E9F0E2"/><path d="M367 271L371 275L378 267" stroke="#6F8F5D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="396" y="275" fill="#555B51" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">API integration</text>

  <path d="M640 41V319" stroke="#E0E4DA" stroke-width="1.5"/>
  <text x="690" y="72" fill="#7A8176" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">HOW I APPROACH A BUILD</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <circle cx="704" cy="122" r="19" fill="#E7E4FB"/><text x="704" y="126" text-anchor="middle" fill="#6253BD" font-size="11" font-weight="700">01</text><text x="739" y="118" fill="#30352F" font-size="14" font-weight="700">Shape the experience</text><text x="739" y="138" fill="#7A8176" font-size="12">Simple flows and clear screens.</text>
    <circle cx="704" cy="194" r="19" fill="#FFF0E8"/><text x="704" y="198" text-anchor="middle" fill="#D96F4D" font-size="11" font-weight="700">02</text><text x="739" y="190" fill="#30352F" font-size="14" font-weight="700">Build with Flutter</text><text x="739" y="210" fill="#7A8176" font-size="12">Responsive interfaces in Dart.</text>
    <circle cx="704" cy="266" r="19" fill="#E9F0E2"/><text x="704" y="270" text-anchor="middle" fill="#6F8F5D" font-size="11" font-weight="700">03</text><text x="739" y="262" fill="#30352F" font-size="14" font-weight="700">Connect the pieces</text><text x="739" y="282" fill="#7A8176" font-size="12">Firebase services and REST APIs.</text>
  </g>

