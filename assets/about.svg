    <pattern id="dots" width="92" height="80" patternUnits="userSpaceOnUse"><circle cx="13" cy="14" r="2.2" fill="#D8D8CE" opacity=".4"/><circle cx="57" cy="8" r="2" fill="#EBC0AC" opacity=".29"/><circle cx="83" cy="38" r="2.4" fill="#D8D8CE" opacity=".37"/><circle cx="34" cy="57" r="2" fill="#D8D8CE" opacity=".38"/></pattern>
